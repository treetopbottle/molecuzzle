<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molecuzzle</title>
<!-- scripts/build.js replaces this link and the script below with style.css and the bundle of src/browser.js -->
<style>
:root {
  --bg: #0e1320; --panel: #161d2e; --panel-2: #1d2639; --line: #2a3550;
  --text: #e6ebf5; --muted: #93a0bb; --accent: #3ce0b4; --accent-2: #7dd3ff; --warn: #ffb347; --bond: #c9d3e6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:hover:not(:disabled) { background: #24304a; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: #1f6f5c; border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
sub { font-size: .72em; line-height: 0; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header b { font-size: 18px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
section { min-width: 0; }
.stage { background-color: #111827; border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; justify-content: center; }
svg { max-width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 24px; }
p { margin: 0; }
.info { display: contents; }
.panel > *, .info > * { order: 4; } /* the Puzzle nav and the mystery molecule's title, then the actions, then the rest, so the actions stay in view on a phone */
.info > .puzzle-nav { order: 1; }
.info > .mystery { order: 2; }
.panel > .actions { order: 3; }
.eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.legend { color: var(--muted); font-size: 14px; }
.rules { margin: 0; padding-left: 20px; font-size: 14px; }
.rules li { margin: 4px 0; }
.key { display: flex; flex-wrap: wrap; gap: 2px 8px; margin: 6px 0 2px -20px; }
.key figure { display: inline-flex; align-items: center; gap: 2px; margin: 0; }
.key .stick { stroke: var(--bond); stroke-width: 3; stroke-linecap: round; }
.key .sym { font-size: 11px; font-weight: 700; }
.key .valence { font-size: 14px; font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.puzzle-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; white-space: nowrap; }
.puzzle-nav button { padding: 4px 12px; }
.puzzle-nav .badge { margin-left: auto; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
.puzzle-nav .badge.solved { color: var(--accent); border-color: rgba(60,224,180,.6); }
.puzzle-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.puzzle-list button { min-width: 44px; padding: 6px 8px; font-size: 14px; }
.puzzle-list button[aria-current] { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2); }
#note { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
#note.good { border-color: rgba(60,224,180,.6); color: #b9f7e4; }
#note.warn { border-color: rgba(255,179,71,.5); color: #ffe0b3; }
#counts { margin-top: 4px; font-size: 14px; }
#counts .warn { color: var(--warn); }
#toast { position: fixed; top: 64px; left: 50%; transform: translate(-50%, -10px); background: #2a3550; border: 1px solid #3d4b72; padding: 8px 14px; border-radius: 99px; opacity: 0; transition: .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.cell { fill: rgba(255,255,255,.09); }
.edge { outline: none; }
.edge .maybe { stroke: rgba(201,211,230,.22); stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
.edge .vis { stroke: var(--bond); stroke-width: 3.4; stroke-linecap: round; }
.edge .hit { fill: transparent; cursor: pointer; }
.edge:hover .maybe, .edge:focus-visible .maybe { stroke: rgba(125,211,255,.7); }
.edge:hover .vis, .edge:focus-visible .vis { stroke: #fff; }
.edge:focus-visible .hit { fill: rgba(125,211,255,.14); }
.atom { pointer-events: none; }
.atom .body { stroke-width: 2; }
.atom .shine { fill: #fff; opacity: .22; }
.atom .sym { font-weight: 700; font-size: 16px; }
.atom .fixed { stroke: rgba(201,211,230,.55); stroke-width: 1.6; }
.atom .hydrogen circle { stroke-width: 1.2; }
.atom .hydrogen text { font-size: 9px; font-weight: 700; }
.pulse .atom .body { animation: pulse .55s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { .pulse .atom .body { animation: none; } }

@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <b>Molecuzzle</b>
  <span id="score" class="legend"></span>
</header>
<main>
  <section>
    <div class="stage"><svg id="board"></svg></div>
    <div id="note">
      <div id="status" role="status"></div>
      <div id="counts"></div>
    </div>
  </section>
  <aside class="panel">
    <div id="info" class="info"></div>
    <div class="actions">
      <button id="btnUndo">Undo</button>
      <button id="btnReset">Reset</button>
      <button id="btnSolve">Show solution</button>
    </div>
    <div>
      <div class="eyebrow">Puzzles</div>
      <ol id="puzzles" class="puzzle-list" aria-label="Puzzles"></ol>
    </div>
  </aside>
</main>
<div id="toast" role="alert"></div>
<script>
(() => {
  // src/storage/progress.js
  var STORAGE_KEY = "molecuzzle-v4";
  var UNDO_MAX = 100;
  var isObject = (x) => typeof x === "object" && x !== null && !Array.isArray(x);
  var isIndex = (x) => Number.isInteger(x) && x >= 0;
  var isBoard = (b) => Array.isArray(b) && b.every((bond) => Array.isArray(bond) && bond.length === 3 && isIndex(bond[0]) && isIndex(bond[1]) && [1, 2, 3].includes(bond[2]));
  var isEntry = (e) => isObject(e) && isBoard(e.bonds) && typeof e.revealed === "boolean" && Array.isArray(e.undo) && e.undo.length <= UNDO_MAX && e.undo.every(isBoard);
  function read(storage2) {
    const empty = { puzzles: {}, current: null };
    try {
      const data = JSON.parse(storage2?.getItem(STORAGE_KEY) ?? "null");
      if (!data || typeof data !== "object") return empty;
      const puzzles = {};
      for (const [id, state] of Object.entries(isObject(data.puzzles) ? data.puzzles : {}))
        if (state === "solved") puzzles[id] = state;
      const progress = { puzzles, current: typeof data.current === "string" ? data.current : null };
      const boards = Object.fromEntries(Object.entries(isObject(data.boards) ? data.boards : {}).filter(([, e]) => isEntry(e)));
      if (Object.keys(boards).length) progress.boards = boards;
      return progress;
    } catch {
      return empty;
    }
  }
  function createProgressStore(storage2) {
    let progress;
    function load() {
      progress = read(storage2);
      return progress;
    }
    function update(change) {
      progress = change(progress ?? load());
      try {
        storage2?.setItem(STORAGE_KEY, JSON.stringify(progress));
      } catch {
      }
      return progress;
    }
    return { load, update };
  }
  function markSolved(progress, id) {
    if (progress.puzzles[id] === "solved") return progress;
    return { ...progress, puzzles: { ...progress.puzzles, [id]: "solved" } };
  }

  // src/app.js
  function startApp({ puzzles, createGame: createGame2, store, createUi: createUi2 }) {
    let progress = store.load();
    let index = Math.max(0, puzzles.findIndex((p) => p.id === progress.current));
    let game;
    const ui = createUi2({
      onChange(k, dir) {
        const result = game.change(k, dir);
        ui.say(result);
        if (result.changed) keep();
      },
      onOpen: open,
      onUndo() {
        if (game.undo()) keep();
      },
      onReset() {
        if (game.reset()) keep();
      },
      onSolve() {
        game.showSolution();
        keep();
      }
    });
    function withEntry(p) {
      const id = puzzles[index].id, saved = game.saved();
      const { boards = {}, ...rest } = p;
      const { [id]: _, ...others } = boards;
      const next = saved ? { ...others, [id]: saved } : others;
      return Object.keys(next).length ? { ...rest, boards: next } : rest;
    }
    function keep() {
      progress = store.update(withEntry);
      update();
    }
    function open(i) {
      index = i;
      game = createGame2(puzzles[i], progress.boards?.[puzzles[i].id]);
      progress = store.update((p) => withEntry({ ...p, current: puzzles[i].id }));
      ui.open(game);
      update();
    }
    function update() {
      const puzzle = puzzles[index], status = game.status();
      if (status.kind === "solved" && progress.puzzles[puzzle.id] !== "solved")
        progress = store.update((p) => markSolved(p, puzzle.id));
      ui.render({
        puzzles,
        index,
        progress,
        status,
        counts: game.counts(),
        done: game.done(),
        canUndo: game.canUndo,
        hasBonds: game.order.some(Boolean)
      });
    }
    open(index);
  }

    doc.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        handlers.onUndo();
      }
    });
    function open(next) {
      game = next;
      board = createBoard($("board"), game, { onChange: handlers.onChange });
    }
    function render(view) {
      const { puzzles, index, progress, status } = view;
      board.render();
      renderPanel($("info"), { ...view, elements });
      renderCounts($("counts"), view.counts);
      $("status").textContent = statusText(status, puzzles[index]);
      $("note").className = STATUS_CLASS[status.kind] ?? "";
      $("btnUndo").disabled = !view.canUndo;
      $("btnReset").disabled = !view.hasBonds && !view.canUndo;
      const solved = puzzles.filter((p) => progress.puzzles[p.id] === "solved").length;
      $("score").textContent = `Solved ${solved} of ${puzzles.length}`;
      renderPuzzleList($("puzzles"), puzzles, progress, index, handlers.onOpen);
    }
    function say(result) {
      const text = reasonText(result);
      if (!text) return;
      const toast = $("toast");
      toast.textContent = text;
      toast.className = "show";
      doc.defaultView.clearTimeout(toastTimer);
      toastTimer = doc.defaultView.setTimeout(() => toast.className = "", 1800);
    }
    return { open, render, say };
  }

  // src/browser.js
  var KEY2 = ["C", "N", "O", "S"].map((symbol) => ({ symbol, valence: ELEMENTS[symbol].valence }));
  var storage;
  try {
    storage = window.localStorage;
  } catch {
  }
  startApp({ puzzles: PUZZLES, createGame, store: createProgressStore(storage), createUi: (handlers) => createUi(document, handlers, { elements: KEY2 }) });
})();
</script>
</body>
