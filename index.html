<style>
:root {

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:hover:not(:disabled) { background: #24304a; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: #1f6f5c; border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
sub { font-size: .72em; line-height: 0; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header b { font-size: 18px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
section { min-width: 0; }
.stage { background-color: #111827; border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; justify-content: center; }
svg { max-width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 24px; }
p { margin: 0; }
.info { display: contents; }
.eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.legend { color: var(--muted); font-size: 14px; }
.rules { margin: 0; padding-left: 20px; font-size: 14px; }
.rules li { margin: 4px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.puzzle-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; white-space: nowrap; }
.puzzle-nav button { padding: 4px 12px; }
.puzzle-nav .badge { margin-left: auto; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
.puzzle-nav .badge.solved { color: var(--accent); border-color: rgba(60,224,180,.6); }
.puzzle-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.puzzle-list button { min-width: 44px; padding: 6px 8px; font-size: 14px; }
.puzzle-list button[aria-current] { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2); }
#status { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
#status.good { border-color: rgba(60,224,180,.6); color: #b9f7e4; }
#status.warn { border-color: rgba(255,179,71,.5); color: #ffe0b3; }
#toast { position: fixed; top: 64px; left: 50%; transform: translate(-50%, -10px); background: #2a3550; border: 1px solid #3d4b72; padding: 8px 14px; border-radius: 99px; opacity: 0; transition: .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.cell { fill: rgba(255,255,255,.09); }
.edge { outline: none; }
.edge .maybe { stroke: rgba(201,211,230,.22); stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
.edge .vis { stroke: var(--bond); stroke-width: 3.4; stroke-linecap: round; }
.edge .hit { fill: transparent; cursor: pointer; }
.edge:hover .maybe, .edge:focus-visible .maybe { stroke: rgba(125,211,255,.7); }
.edge:hover .vis, .edge:focus-visible .vis { stroke: #fff; }
.edge:focus-visible .hit { fill: rgba(125,211,255,.14); }
.atom { pointer-events: none; }
.atom .body { stroke-width: 2; transition: filter .2s; }
.atom .shine { fill: #fff; opacity: .22; }
.atom .sym { font-weight: 700; font-size: 16px; }
.atom.ok .body { filter: drop-shadow(0 0 5px rgba(60,224,180,.8)); }
.atom .badge circle { fill: var(--warn); stroke: #3a2600; }
.atom .badge text { font-size: 11px; font-weight: 700; fill: #3a2600; }
.atom.ok .badge { display: none; }
.solved .atom .body { animation: pulse .55s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { .solved .atom .body { animation: none; } }

@media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  var OFFSETS = [[], [0], [-4.5, 4.5], [-8, 0, 8]];
  function el(tag, attrs, parent) {
    const e = parent.ownerDocument.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }
  var place = (a) => `${a.r + 1},${a.c + 1}`;
  function createBoard(svg, game, { onChange }) {
    const { puzzle, atoms, bonds } = game;
    const xy = (a) => [PAD + a.c * CELL, PAD + a.r * CELL];
    svg.replaceChildren();
    svg.classList.remove("solved");
    const width = PAD * 2 + (puzzle.cols - 1) * CELL, height = PAD * 2 + (puzzle.rows - 1) * CELL;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("width", width * SCALE);
    svg.setAttribute("role", "group");
    svg.setAttribute("aria-label", `Board, ${puzzle.rows} by ${puzzle.cols}`);
    const cells = el("g", { "aria-hidden": "true" }, svg), edgesLayer = el("g", {}, svg), atomsLayer = el("g", {}, svg);
    for (let r = 0; r < puzzle.rows; r++)
      for (let c = 0; c < puzzle.cols; c++) el("circle", { class: "cell", cx: PAD + c * CELL, cy: PAD + r * CELL, r: 2.5 }, cells);
    const edgeEls = bonds.map((e, k) => {
      const g = el("g", { class: "edge", role: "button", tabindex: 0, "data-bond": k }, edgesLayer);
      const lines = el("g", {}, g);
      const [x1, y1] = xy(atoms[e.a]), [x2, y2] = xy(atoms[e.b]);
      el("rect", e.horizontal ? { class: "hit", x: x1, y: y1 - HIT / 2, width: x2 - x1, height: HIT } : { class: "hit", x: x1 - HIT / 2, y: y1, width: HIT, height: y2 - y1 }, g);
      g.addEventListener("click", () => onChange(k, 1));
      g.addEventListener("contextmenu", (ev) => {
        ev.preventDefault();
        onChange(k, -1);
      });
      g.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          onChange(k, 1);
        } else if (ev.key === "Backspace" || ev.key === "Delete" || ev.key === "-") {
          ev.preventDefault();
          onChange(k, -1);
        }
      });
      return { g, lines };
    });
    const atomEls = atoms.map((a) => {
      const E = ELEMENTS2[a.el], [x, y] = xy(a);
      const g = el("g", { class: "atom", role: "img", transform: `translate(${x},${y})` }, atomsLayer);
      el("circle", { class: "body", r: E.r, fill: E.color, stroke: E.stroke }, g);
      el("circle", { class: "shine", r: E.r * 0.42, cx: -E.r * 0.32, cy: -E.r * 0.36 }, g);
      const t = el("text", { class: "sym", "text-anchor": "middle", "dominant-baseline": "central", fill: E.text, y: 1 }, g);
      t.textContent = a.el;
      const badge = el("g", { class: "badge", transform: `translate(${E.r * 0.78},${-E.r * 0.78})` }, g);
      el("circle", { r: 9 }, badge);
      const count = el("text", { "text-anchor": "middle", "dominant-baseline": "central", y: 0.5 }, badge);
      return { g, count };
    });
    function render() {
      const order = game.order;
      bonds.forEach((e, k) => {
        const A = atoms[e.a], B = atoms[e.b], [x1, y1] = xy(A), [x2, y2] = xy(B), o = order[k];
        const [nx, ny] = e.horizontal ? [0, 1] : [1, 0];
        const { g, lines } = edgeEls[k];
        lines.replaceChildren();
        if (!o) el("line", { class: "maybe", x1, y1, x2, y2 }, lines);
        for (const d of OFFSETS[o])
          el("line", { class: "vis", x1: x1 + nx * d, y1: y1 + ny * d, x2: x2 + nx * d, y2: y2 + ny * d }, lines);
        g.setAttribute("data-order", o);
        g.setAttribute("aria-label", `${A.el} ${place(A)} to ${B.el} ${place(B)}: ${ORDER_NAMES[o]}`);
      });
      atoms.forEach((a, i) => {
        const left = game.remaining(i), { g, count } = atomEls[i];
        g.classList.toggle("ok", left === 0);
        count.textContent = left;
        g.setAttribute("aria-label", `${ELEMENTS2[a.el].name} ${place(a)}: ${left ? `needs ${left} more bond${left > 1 ? "s" : ""}` : "complete"}`);
      });
      svg.classList.toggle("solved", game.status().kind === "solved");
    }
    render();
    return { render };
  }

  // src/ui/panel.js
  var RULES = [
    "Bonds run straight along a row or column, between atoms with nothing in between. The dotted lines show where they can go.",
    "Click a dotted line to bond. Click again for a double, then a triple bond; once more removes it. Right-click lowers it.",
    "Bonds can't cross.",
    "Each atom needs exactly its number of bonds (orange badge): H 1, O 2, N 3, C 4.",
    "All atoms join into one molecule. There is exactly one solution."
  ];
  var BADGES = { solved: "\u2713 Solved" };
  function build(panel) {
    const doc = panel.ownerDocument;
    panel.innerHTML = `
    <nav class="puzzle-nav" aria-label="Puzzle">
      <button id="prev" aria-label="Previous puzzle">\u2039</button>
      <span id="counter"></span>
      <button id="next" aria-label="Next puzzle">\u203A</button>
      <span id="badge" class="badge"></span>
    </nav>
    <div>
      <div class="eyebrow">Mystery molecule</div>
      <h1 id="title"></h1>
      <div id="formula" class="legend"></div>
    </div>
    <p id="fact" class="legend" hidden></p>
    <button id="nextPuzzle" class="primary" hidden>Next puzzle \u2192</button>
    <ol class="rules"></ol>`;
    panel.querySelector(".rules").append(...RULES.map((rule) => {
      const li = doc.createElement("li");
      li.textContent = rule;
      return li;
    }));
  }
  function renderPanel(panel, { puzzles, index, progress, done }) {
    if (!panel.querySelector("nav")) build(panel);
    const $ = (id) => panel.querySelector(`#${id}`);
    const puzzle = puzzles[index], last = index === puzzles.length - 1;
    const opens = (button, i, can) => {
      button.disabled = !can;
      button.dataset.open = String(i);
    };
    $("counter").textContent = `Puzzle ${index + 1} of ${puzzles.length}`;
    opens($("prev"), index - 1, index > 0);
    opens($("next"), index + 1, !last);
    const state = progress.puzzles[puzzle.id];
    $("badge").textContent = BADGES[state] ?? "Unsolved";
    $("badge").className = `badge ${state ?? ""}`;
    $("title").textContent = done ? puzzle.name : "?";
    if (done) $("formula").replaceChildren(...formulaNodes(panel.ownerDocument, puzzle.formula));
    else $("formula").textContent = "Bond every atom to find out what it is.";
    $("fact").textContent = puzzle.fact;
    $("fact").hidden = !done;
    opens($("nextPuzzle"), index + 1, !last);
    $("nextPuzzle").hidden = !done || last;
  }
  function formulaNodes(doc, formula) {
    return formula.split(/(\d+)/).filter(Boolean).map((part) => {
      if (!/^\d+$/.test(part)) return doc.createTextNode(part);
      const sub = doc.createElement("sub");
      sub.textContent = part;
      return sub;
    });
  }

  // src/ui/puzzle-list.js
  function renderPuzzleList(list, puzzles, progress, current, onPick) {
    const doc = list.ownerDocument;
    list.replaceChildren(...puzzles.map((p, i) => {
      const solved = progress.puzzles[p.id] === "solved";
      const li = doc.createElement("li");
      const button = doc.createElement("button");
      button.type = "button";
      button.textContent = `${i + 1}${solved ? " \u2713" : ""}`;
      button.setAttribute("aria-label", `Puzzle ${i + 1}${solved ? `: ${p.name}, solved` : ""}`);
      if (solved) button.title = p.name;
      if (i === current) button.setAttribute("aria-current", "true");
      button.addEventListener("click", () => onPick(i));
      li.append(button);
      return li;
    }));
  }

  // src/ui/messages.js
  function statusText(status, puzzle) {
    switch (status.kind) {
      case "empty":
        return "Click a dotted line between two atoms to bond them.";
      case "open":
        return `${status.open} atom${status.open > 1 ? "s" : ""} still need${status.open > 1 ? "" : "s"} bonds.`;
      case "pieces":
        return "Every atom has its bonds, but they form more than one molecule. Everything must join up.";
      case "solved":
        return `\u2713 Solved! It's ${puzzle.name}.`;
      case "revealed":
        return `Here is ${puzzle.name}. Reset and build it yourself to mark it solved.`;
    }
  }
  function reasonText(result, atoms) {
    switch (result.reason) {
      case "full":
        return `${ELEMENTS2[atoms[result.atom].el].name} already has all its bonds.`;
      case "crossing":
        return "Bonds can't cross.";
      default:
        return null;
    }
  }

  // src/ui/ui.js
  var STATUS_CLASS = { solved: "good", revealed: "good", pieces: "warn" };
  function createUi(doc, handlers, { confirm = (question) => doc.defaultView.confirm(question) } = {}) {
    const $ = (id) => doc.getElementById(id);
    let game, board, toastTimer;
    $("info").addEventListener("click", (e) => {
      const button = e.target.closest("button[data-open]");
      if (button && !button.disabled) handlers.onOpen(Number(button.dataset.open));
    });
    $("btnUndo").addEventListener("click", () => handlers.onUndo());
    $("btnReset").addEventListener("click", () => {
      if (confirm("Reset this puzzle? Its bonds and undo history are removed.")) handlers.onReset();
    });
    $("btnSolve").addEventListener("click", () => {
      if (confirm("Show the solution?")) handlers.onSolve();
    });
    doc.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        handlers.onUndo();
      }
    });
    function open(next) {
      game = next;
      board = createBoard($("board"), game, { onChange: handlers.onChange });
    }
    function render(view) {
      const { puzzles, index, progress, status } = view;
      board.render();
      renderPanel($("info"), view);
      const line = $("status");
      line.textContent = statusText(status, puzzles[index]);
      line.className = STATUS_CLASS[status.kind] ?? "";
      $("btnUndo").disabled = !view.canUndo;
      $("btnReset").disabled = !view.hasBonds && !view.canUndo;
      const solved = puzzles.filter((p) => progress.puzzles[p.id] === "solved").length;
      $("score").textContent = `Solved ${solved} of ${puzzles.length}`;
      renderPuzzleList($("puzzles"), puzzles, progress, index, handlers.onOpen);
    }
    function say(result) {
      const text = reasonText(result, game.atoms);
      if (!text) return;
      const toast = $("toast");
      toast.textContent = text;
      toast.className = "show";
      doc.defaultView.clearTimeout(toastTimer);
      toastTimer = doc.defaultView.setTimeout(() => toast.className = "", 1800);
    }
    return { open, render, say };
  }

  // src/browser.js
  var storage;
  try {
    storage = window.localStorage;
  } catch {
  }
  startApp({ puzzles: PUZZLES, createGame, store: createProgressStore(storage), createUi: (handlers) => createUi(document, handlers) });
})();
</script>
</body>
</html>
