<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molecuzzle</title>
<!-- scripts/build.js replaces this link and the script below with style.css and the bundle of src/browser.js -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>Molecuzzle</b>
  <span id="score" class="legend"></span>
</header>
<main>
  <section>
    <div class="stage"><svg id="board"></svg></div>
    <div id="note">
      <div id="status" role="status"></div>
      <div id="counts"></div>
    </div>
  </section>
  <aside class="panel">
    <div id="info" class="info"></div>
    <div class="actions">
      <button id="btnUndo">Undo</button>
      <button id="btnReset">Reset</button>
      <button id="btnSolve">Show solution</button>
    </div>
    <div>
      <div class="eyebrow">Puzzles</div>
      <ol id="puzzles" class="puzzle-list" aria-label="Puzzles"></ol>
    </div>
  </aside>
</main>
<div id="toast" role="alert"></div>
<script type="module" src="browser.js"></script>
</body>
</html>
