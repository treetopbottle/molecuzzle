<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Without Hydrogens</title>
<style>
  :root {
    --bg: #0e1320; --panel: #161d2e; --panel-2: #1d2639; --line: #2a3550;
    --text: #e6ebf5; --muted: #93a0bb; --accent: #3ce0b4; --accent-2: #7dd3ff; --warn: #ffb347; --bond: #c9d3e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent-2); }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #24304a; }
  button:disabled { opacity: .4; cursor: default; }
  sub { font-size: .72em; line-height: 0; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-size: 18px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
  .stage { background-color: #111827; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  svg { width: 100%; max-height: 70vh; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 24px; }
  .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  ol { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; }
  .actions, .list { display: flex; gap: 8px; flex-wrap: wrap; }
  .list button { min-width: 44px; }
  .list button[aria-current="true"] { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(125,211,255,.35); }
  .list button.done { color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; border-left: 3px solid var(--line); padding-left: 10px; }
  #status { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
  #status.good { border-color: rgba(60,224,180,.6); color: #b9f7e4; }
  #status.warn { border-color: rgba(255,179,71,.5); color: #ffe0b3; }
  #toast { position: fixed; top: 64px; left: 50%; transform: translate(-50%, -10px); background: #2a3550; border: 1px solid #3d4b72; padding: 8px 14px; border-radius: 99px; opacity: 0; transition: .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .legend { color: var(--muted); font-size: 14px; }

  .cell { fill: rgba(255,255,255,.09); }
  .edge .maybe { stroke: rgba(201,211,230,.22); stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
  .edge .vis { stroke: var(--bond); stroke-width: 3.4; stroke-linecap: round; }
  .edge .hit { stroke: transparent; stroke-width: 22; cursor: pointer; }
  .edge:hover .maybe { stroke: rgba(125,211,255,.7); }
  .edge:hover .vis { stroke: #fff; }
  .atom .body { stroke-width: 2; transition: filter .2s; }
  .atom .shine { fill: #fff; opacity: .22; }
  .atom .sym { font-weight: 700; font-size: 15px; }
  .atom .fixed { stroke: rgba(201,211,230,.55); stroke-width: 1.6; }
  .atom .hydrogen text { font-size: 9px; font-weight: 700; }
  .atom .hydrogen circle { stroke-width: 1.2; }
  .atom.ok .body { filter: drop-shadow(0 0 5px rgba(60,224,180,.8)); }
  .atom .badge circle { fill: var(--warn); stroke: #3a2600; }
  .atom .badge text { font-size: 11px; font-weight: 700; fill: #3a2600; }
  .atom.ok .badge { display: none; }
  .atom { pointer-events: none; }
  .solved .atom .body { animation: pulse .55s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .solved .atom .body { animation: none; } }

  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <b>Without hydrogens <span style="color:var(--muted);font-weight:400;font-size:14px">prototype</span></b>
  <span class="legend" id="counter"></span>
</header>
<main>
  <section>
    <div class="stage"><svg id="board"></svg></div>
    <div id="status"></div>
  </section>
  <aside class="panel">
    <div>
      <div class="eyebrow">Mystery molecule</div>
      <h1 id="title">?</h1>
      <div id="formula" class="legend">Bond every atom to find out what it is.</div>
    </div>
    <p id="fact" class="legend" hidden></p>
    <p id="note" class="note" hidden></p>
    <ol id="rules"></ol>
    <div class="actions">
      <button id="btnUndo">Undo</button>
      <button id="btnReset">Reset</button>
      <button id="btnSolve">Show solution</button>
    </div>
    <div>
      <div class="eyebrow">Puzzles</div>
      <div class="list" id="list"></div>
    </div>
  </aside>
</main>
<div id="toast"></div>

<script>
"use strict";
// The hydrogens aren't atoms on the Grid: each atom has its own already
// bonded, drawn small beside it, so it needs its valence minus them in bonds
// to other atoms. A loop of dotted lines is a choice: which line stays empty,
// or, round a ring, that none does. Every layout was made with
// scripts/generate.js, with stand-in Elements for an atom with its hydrogens,
// so each has exactly one solution.
const LOOK = {
  H: { color: "#eef2f7", stroke: "#9aa6b8", text: "#2a2f38", r: 17, v: 1 },
  C: { color: "#454b55", stroke: "#1e2228", text: "#ffffff", r: 22, v: 4 },
  N: { color: "#3d6ef5", stroke: "#1f3f9e", text: "#ffffff", r: 22, v: 3 },
  O: { color: "#e5443f", stroke: "#8f201d", text: "#ffffff", r: 22, v: 2 },
};

const PUZZLES = [
  {
    name: "Acetic acid", formula: "C2H4O2",
    fact: "Vinegar is acetic acid in water, about 4 to 8% of it.",
    note: "To learn the rules: no loop of dotted lines, so every line is a bond.",
    rows: 3, cols: 2,
    atoms: [["O",0,1],["CH3",1,0],["C",1,1],["OH",2,1]],
    solution: [[0,2,2],[1,2,1],[2,3,1]],
  },
  {
    name: "1,4-Dioxane", formula: "C4H8O2",
    fact: "1,4-Dioxane is a solvent that mixes with water as well as with many oils.",
    rows: 3, cols: 2,
    atoms: [["CH2",0,0],["O",0,1],["CH2",1,0],["CH2",1,1],["O",2,0],["CH2",2,1]],
    solution: [[0,1,1],[0,2,1],[1,3,1],[2,4,1],[3,5,1],[4,5,1]],
  },
  {
    name: "Cyclohexanone", formula: "C6H10O",
    fact: "Most cyclohexanone is turned into nylon, for ropes, stockings and carpets.",
    rows: 4, cols: 2,
    atoms: [["CH2",0,0],["CH2",0,1],["CH2",1,0],["CH2",1,1],["CH2",2,0],["C",2,1],["O",3,1]],
    solution: [[0,1,1],[0,2,1],[1,3,1],[2,4,1],[3,5,1],[4,5,1],[5,6,2]],
  },
  {
    name: "Cyclohexane-1,4-dione", formula: "C6H8O2",
    fact: "Cyclohexane-1,4-dione is benzoquinone with hydrogens in place of its two C=C double bonds.",
    rows: 5, cols: 2,
    atoms: [["O",0,1],["CH2",1,0],["C",1,1],["CH2",2,0],["CH2",2,1],["C",3,0],["CH2",3,1],["O",4,0]],
    solution: [[0,2,2],[1,2,1],[1,3,1],[2,4,1],[3,5,1],[4,6,1],[5,6,1],[5,7,2]],
  },
  {
    name: "1,4-Benzoquinone", formula: "C6H4O2",
    fact: "Bombardier beetles spray a boiling mix of benzoquinones at their attackers.",
    rows: 3, cols: 4,
    atoms: [["CH",0,1],["CH",0,2],["O",1,0],["C",1,1],["C",1,2],["O",1,3],["CH",2,1],["CH",2,2]],
    solution: [[0,1,2],[0,3,1],[1,4,1],[2,3,2],[3,6,1],[4,5,2],[4,7,1],[6,7,2]],
  },
  {
    name: "Citric acid", formula: "C6H8O7",
    fact: "Citric acid makes lemons sour, and is at the heart of the cycle in which your cells burn food for energy.",
    rows: 6, cols: 3,
    atoms: [["O",0,0],["OH",0,1],["C",1,1],["O",1,2],["CH2",2,1],["C",3,0],["C",3,1],["OH",3,2],["OH",4,0],["CH2",4,1],["O",5,0],["C",5,1],["OH",5,2]],
    solution: [[0,5,2],[1,2,1],[2,3,2],[2,4,1],[4,6,1],[5,6,1],[5,8,1],[6,7,1],[6,9,1],[9,11,1],[10,11,2],[11,12,1]],
  },
  {
    name: "Glucose", formula: "C6H12O6",
    fact: "Glucose is the sugar your cells run on; in water most of it curls up into this ring of five carbons and an oxygen.",
    rows: 3, cols: 5,
    atoms: [["OH",0,0],["CH",0,1],["CH",0,2],["OH",0,3],["OH",1,0],["CH",1,1],["CH",1,2],["OH",1,3],["O",2,1],["CH",2,2],["CH2",2,3],["OH",2,4]],
    solution: [[0,1,1],[1,2,1],[1,5,1],[2,3,1],[2,6,1],[4,5,1],[5,8,1],[6,7,1],[6,9,1],[8,9,1],[9,10,1],[10,11,1]],
  },
];

const RULES = [
  "Bonds run straight along a row or column, between atoms with nothing in between. The dotted lines show where they can go.",
  "Click a dotted line to bond. Click again for a double, then a triple bond; once more removes it. Right-click lowers it.",
  "Bonds can't cross.",
  "Each atom needs exactly its number of bonds: C 4, N 3, O 2. The small hydrogens are already bonded and count; the orange badge shows how many it still needs.",
  "All atoms join into one molecule. There is exactly one solution.",
];
document.getElementById("rules").replaceChildren(...RULES.map(t => Object.assign(document.createElement("li"), { textContent: t })));

const CELL = 84, PAD = 46, SVGNS = "http://www.w3.org/2000/svg";
const board = document.getElementById("board");
function el(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
const $ = id => document.getElementById(id);
/** "CH3" → { el: "C", h: 3 }; "OH" → { el: "O", h: 1 }; "H" → { el: "H", h: 0 }. */
function parse(label) { const m = label.match(/^([A-Z][a-z]?)(?:H(\d*))?$/); return { el: m[1], h: m[2] === undefined ? 0 : Number(m[2] || 1) }; }

let puzzle, atoms, edges, order, history, solved, atomEls, index = 0;
const done = new Set();

function crosses(e, f) {
  if (e.h === f.h) return false;
  const H = e.h ? e : f, V = e.h ? f : e;
  const r = atoms[H.a].r, c = atoms[V.a].c;
  return c > atoms[H.a].c && c < atoms[H.b].c && r > atoms[V.a].r && r < atoms[V.b].r;
}
const bondSum = i => edges.reduce((t, e, k) => t + (e.a === i || e.b === i ? order[k] : 0), 0);
const remaining = i => atoms[i].need - bondSum(i);

function open(i) {
  index = i; puzzle = PUZZLES[i];
  atoms = puzzle.atoms.map(([label, r, c]) => { const p = parse(label); return { ...p, label, r, c, need: LOOK[p.el].v - p.h, x: PAD + c * CELL, y: PAD + r * CELL }; });
  edges = [];
  atoms.forEach((a, i) => {
    let right = null, down = null;
    atoms.forEach((b, j) => {
      if (b.r === a.r && b.c > a.c && (right === null || b.c < atoms[right].c)) right = j;
      if (b.c === a.c && b.r > a.r && (down === null || b.r < atoms[down].r)) down = j;
    });
    if (right !== null) edges.push({ a: i, b: right, h: true });
    if (down !== null) edges.push({ a: i, b: down, h: false });
  });
  order = edges.map(() => 0); history = [];
  board.replaceChildren();
  board.setAttribute("viewBox", `0 0 ${PAD * 2 + (puzzle.cols - 1) * CELL} ${PAD * 2 + (puzzle.rows - 1) * CELL}`);
  const cells = el("g", {}, board);
  board.edgesLayer = el("g", {}, board);
  const atomsLayer = el("g", {}, board);
  for (let r = 0; r < puzzle.rows; r++) for (let c = 0; c < puzzle.cols; c++) el("circle", { class: "cell", cx: PAD + c * CELL, cy: PAD + r * CELL, r: 2.5 }, cells);
  atomEls = atoms.map(a => {
    const L = LOOK[a.el], g = el("g", { class: "atom", transform: `translate(${a.x},${a.y})` }, atomsLayer);
    // Its hydrogens: small, already bonded, on the diagonals, where no dotted line runs; the badge keeps the top right.
    const H = LOOK.H;
    for (const [dx, dy] of [[-1, 1], [1, 1], [-1, -1]].slice(0, a.h)) {
      el("line", { class: "fixed", x1: dx * L.r * .7, y1: dy * L.r * .7, x2: dx * 25, y2: dy * 25 }, g);
      const hg = el("g", { class: "hydrogen", transform: `translate(${dx * 28},${dy * 28})` }, g);
      el("circle", { r: 8.5, fill: H.color, stroke: H.stroke }, hg);
      const ht = el("text", { "text-anchor": "middle", "dominant-baseline": "central", fill: H.text, y: .5 }, hg);
      ht.textContent = "H";
    }
    el("circle", { class: "body", r: L.r, fill: L.color, stroke: L.stroke }, g);
    el("circle", { class: "shine", r: L.r * .42, cx: -L.r * .32, cy: -L.r * .36 }, g);
    const t = el("text", { class: "sym", "text-anchor": "middle", "dominant-baseline": "central", fill: L.text, y: 1 }, g);
    t.textContent = a.el;
    const badge = el("g", { class: "badge", transform: `translate(${L.r * .78},${-L.r * .78})` }, g);
    el("circle", { r: 9 }, badge);
    const bt = el("text", { "text-anchor": "middle", "dominant-baseline": "central", y: .5 }, badge);
    return { g, bt };
  });
  reset();
  $("note").hidden = !puzzle.note;
  $("note").textContent = puzzle.note ?? "";
  update();
}

function render() {
  board.edgesLayer.replaceChildren();
  edges.forEach((e, k) => {
    const A = atoms[e.a], B = atoms[e.b], g = el("g", { class: "edge" }, board.edgesLayer);
    const nx = e.h ? 0 : 1, ny = e.h ? 1 : 0, o = order[k];
    if (!o) el("line", { class: "maybe", x1: A.x, y1: A.y, x2: B.x, y2: B.y }, g);
    for (const d of o === 1 ? [0] : o === 2 ? [-4.5, 4.5] : o === 3 ? [-8, 0, 8] : [])
      el("line", { class: "vis", x1: A.x + nx * d, y1: A.y + ny * d, x2: B.x + nx * d, y2: B.y + ny * d }, g);
    const hit = el("line", { class: "hit", x1: A.x, y1: A.y, x2: B.x, y2: B.y }, g);
    hit.addEventListener("click", () => change(k, +1));
    hit.addEventListener("contextmenu", ev => { ev.preventDefault(); change(k, -1); });
  });
  atoms.forEach((a, i) => {
    const left = remaining(i);
    atomEls[i].g.classList.toggle("ok", left === 0);
    atomEls[i].bt.textContent = left;
  });
  $("btnUndo").disabled = !history.length;
  $("counter").textContent = `Puzzle ${index + 1} of ${PUZZLES.length} · ${edges.length - atoms.length + 1} loops of dotted lines`;
  $("list").replaceChildren(...PUZZLES.map((p, i) => {
    const b = Object.assign(document.createElement("button"), { type: "button", textContent: `${i + 1}${done.has(i) ? " ✓" : ""}` });
    if (done.has(i)) b.className = "done";
    if (i === index) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => open(i));
    return b;
  }));
}

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.className = "show"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", 1800); }

function change(k, dir) {
  if (solved) return;
  const e = edges[k], cur = order[k];
  let next = cur + dir;
  if (dir > 0 && cur === 0) {
    const full = [e.a, e.b].find(i => remaining(i) === 0);
    if (full !== undefined) { toast(`That ${atoms[full].el} already has all its bonds.`); return; }
  }
  if (dir > 0 && (next > 3 || next - cur > Math.min(remaining(e.a), remaining(e.b)))) next = 0;
  if (next < 0 || next === cur) return;
  if (cur === 0 && edges.some((f, j) => order[j] && crosses(e, f))) { toast("Bonds can't cross."); return; }
  history.push([...order]);
  order[k] = next;
  update();
}

function joined() {
  const seen = new Set([0]), q = [0];
  while (q.length) {
    const u = q.pop();
    edges.forEach((e, k) => {
      if (!order[k] || (e.a !== u && e.b !== u)) return;
      const v = e.a === u ? e.b : e.a;
      if (!seen.has(v)) { seen.add(v); q.push(v); }
    });
  }
  return seen.size === atoms.length;
}

function setStatus(html, kind) { const s = $("status"); s.innerHTML = html; s.className = kind || ""; }
const fmt = f => f.replace(/(\d+)/g, "<sub>$1</sub>");

function update() {
  render();
  const left = atoms.filter((_, i) => remaining(i) > 0).length;
  if (!order.some(Boolean)) setStatus("Click a dotted line between two atoms to bond them.");
  else if (left) setStatus(`${left} atom${left > 1 ? "s" : ""} still need${left > 1 ? "" : "s"} bonds.`);
  else if (!joined()) setStatus("Every atom has its bonds, but they form more than one molecule. Everything must join up.", "warn");
  else win();
}

function win() {
  solved = true;
  board.classList.add("solved");
  $("title").textContent = puzzle.name;
  $("formula").innerHTML = fmt(puzzle.formula);
  $("fact").textContent = puzzle.fact; $("fact").hidden = false;
  if (!revealed) done.add(index);
  setStatus(revealed ? `Here is <b>${puzzle.name}</b>.` : `✓ Solved! It's <b>${puzzle.name}</b>.`, "good");
  render();
}

let revealed = false;
function reset() {
  solved = false; revealed = false; board.classList.remove("solved");
  $("title").textContent = "?";
  $("formula").textContent = "Bond every atom to find out what it is.";
  $("fact").hidden = true;
}

$("btnUndo").addEventListener("click", () => { if (!history.length) return; reset(); order = history.pop(); update(); });
$("btnReset").addEventListener("click", () => { if (order.some(Boolean)) history.push([...order]); reset(); order = edges.map(() => 0); update(); });
$("btnSolve").addEventListener("click", () => {
  if (!confirm("Show the solution?")) return;
  history.push([...order]); reset(); revealed = true;
  order = edges.map(e => { const s = puzzle.solution.find(([a, b]) => (a === e.a && b === e.b) || (a === e.b && b === e.a)); return s ? s[2] : 0; });
  update();
});
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); $("btnUndo").click(); } });

open(0);
</script>
</body>
</html>
